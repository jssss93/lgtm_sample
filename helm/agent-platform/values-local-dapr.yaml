# ════════════════════════════════════════════════════════════════
# 로컬 K8s + Dapr
# Usage: helm install ... -f values-local-base.yaml -f values-local-dapr.yaml
# ════════════════════════════════════════════════════════════════

dapr:
  enabled: true
  stateStore: redis
  pubsub: redis
  secretStore: local

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  resources:
    memory: 128Mi
    cpu: 100m

accessControl:
  enabled: true
  defaultAction: deny
  trustDomain: "public"

resiliency:
  retry:
    maxRetries: 3
    duration: 3s
  timeout: 30s
  circuitBreaker:
    maxRequests: 5
    trip: "consecutiveFailures > 3"
