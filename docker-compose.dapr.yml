services:

  # ─── Infrastructure ───
  redis:
    image: redis:7
    ports:
      - "6381:6379"


  placement:
    image: daprio/dapr:1.17.3
    command: ["./placement", "-port", "50006"]
    ports:
      - "50006:50006"

  grafana:
    image: grafana/grafana:12.4.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ../lgtm_volume/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.10.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./deploy/compose/configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../lgtm_volume/prometheus:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../lgtm_volume/loki:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/compose/configs/tempo.yaml:/etc/tempo.yaml
      - ../lgtm_volume/tempo:/tmp/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    command: ["--config=/etc/otel-config.yaml"]
    user: "0:0"
    volumes:
      - ./deploy/compose/configs/otel-config.yaml:/etc/otel-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - prometheus
      - loki
      - tempo

  # ─── Agent: Orchestrator + Dapr Sidecar ───
  agent-orchestrator:
    build: ./agent
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=agent-orchestrator
      - AGENT_TYPE=orchestrator
      - USE_DAPR=true
      - DAPR_HTTP_PORT=3500
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      agent-search:
        condition: service_healthy
      agent-summarizer:
        condition: service_healthy
      agent-coder:
        condition: service_healthy
      otel-collector:
        condition: service_started

  orchestrator-dapr:
    image: daprio/daprd:1.17.3
    command: ["./daprd",
      "--app-id", "agent-orchestrator",
      "--app-port", "8000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "placement:50006",
      "--config", "/config/dapr-config.yaml",
      "--resources-path", "/components",
      "--log-level", "info"]
    volumes:
      - ./deploy/compose/dapr/components:/components
      - ./deploy/compose/dapr/components/dapr-config.yaml:/config/dapr-config.yaml
      - ./deploy/compose/dapr/secrets:/dapr-secrets:ro
    network_mode: "service:agent-orchestrator"
    depends_on:
      - agent-orchestrator
      - placement
      - redis

  # ─── Agent: Search + Dapr Sidecar ───
  agent-search:
    build: ./agent
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=agent-search
      - AGENT_TYPE=search
      - USE_DAPR=true
      - DAPR_HTTP_PORT=3500
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector

  search-dapr:
    image: daprio/daprd:1.17.3
    command: ["./daprd",
      "--app-id", "agent-search",
      "--app-port", "8000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "placement:50006",
      "--config", "/config/dapr-config.yaml",
      "--resources-path", "/components",
      "--log-level", "info"]
    volumes:
      - ./deploy/compose/dapr/components:/components
      - ./deploy/compose/dapr/components/dapr-config.yaml:/config/dapr-config.yaml
    network_mode: "service:agent-search"
    depends_on:
      - agent-search
      - placement
      - redis

  # ─── Agent: Summarizer + Dapr Sidecar ───
  agent-summarizer:
    build: ./agent
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=agent-summarizer
      - AGENT_TYPE=summarizer
      - USE_DAPR=true
      - DAPR_HTTP_PORT=3500
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector

  summarizer-dapr:
    image: daprio/daprd:1.17.3
    command: ["./daprd",
      "--app-id", "agent-summarizer",
      "--app-port", "8000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "placement:50006",
      "--config", "/config/dapr-config.yaml",
      "--resources-path", "/components",
      "--log-level", "info"]
    volumes:
      - ./deploy/compose/dapr/components:/components
      - ./deploy/compose/dapr/components/dapr-config.yaml:/config/dapr-config.yaml
    network_mode: "service:agent-summarizer"
    depends_on:
      - agent-summarizer
      - placement
      - redis

  # ─── Agent: Coder + Dapr Sidecar ───
  agent-coder:
    build: ./agent
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=agent-coder
      - AGENT_TYPE=coder
      - USE_DAPR=true
      - DAPR_HTTP_PORT=3500
    ports:
      - "8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      - otel-collector

  coder-dapr:
    image: daprio/daprd:1.17.3
    command: ["./daprd",
      "--app-id", "agent-coder",
      "--app-port", "8000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "placement:50006",
      "--config", "/config/dapr-config.yaml",
      "--resources-path", "/components",
      "--log-level", "info"]
    volumes:
      - ./deploy/compose/dapr/components:/components
      - ./deploy/compose/dapr/components/dapr-config.yaml:/config/dapr-config.yaml
    network_mode: "service:agent-coder"
    depends_on:
      - agent-coder
      - placement
      - redis

  # ─── Traffic Generator ───
  loadgen:
    build: ./loadgen
    environment:
      - ORCHESTRATOR_URL=http://agent-orchestrator:8000
      - INTERVAL=8
      - MAX_DURATION=300
    depends_on:
      agent-orchestrator:
        condition: service_healthy
