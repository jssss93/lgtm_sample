# ════════════════════════════════════════════════════════════════
# 로컬 K8s 공통 설정 (base)
# 이 파일 단독 사용 불가 — values-local.yaml 또는 values-local-dapr.yaml과 함께 사용
# Usage: helm install ... -f values-local-base.yaml -f values-local.yaml
# ════════════════════════════════════════════════════════════════

agents:
  - name: orchestrator
    type: orchestrator
    model: gpt-4.1
    replicas: 1
    port: 8000
    service:
      type: NodePort
      nodePort: 30800
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    hpa:
      enabled: false
    keda:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetRPS: 2
      cooldownPeriod: 300
      pollingInterval: 15
    isOrchestrator: true

  - name: search
    type: search
    model: gpt-4.1-mini
    replicas: 1
    port: 8001
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
    hpa:
      enabled: false
    keda:
      enabled: true
      minReplicas: 1
      maxReplicas: 6
      targetRPS: 2
      cooldownPeriod: 300
      pollingInterval: 15

  - name: summarizer
    type: summarizer
    model: gpt-4.1-mini
    replicas: 1
    port: 8002
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
    hpa:
      enabled: false
    keda:
      enabled: true
      minReplicas: 1
      maxReplicas: 6
      targetRPS: 2
      cooldownPeriod: 300
      pollingInterval: 15

  - name: coder
    type: coder
    model: gpt-4.1
    replicas: 1
    port: 8003
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    hpa:
      enabled: false
    keda:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetRPS: 1
      cooldownPeriod: 300
      pollingInterval: 15

image:
  repository: agent
  tag: local
  pullPolicy: Never

azureOpenAI:
  keyVaultName: ""
  secretName: ""
  secretRef: "aoai-secret"

otel:
  enabled: true
  endpoint: "http://otel-collector.monitoring:4317"

langfuse:
  enabled: true
  host: "http://langfuse.langfuse:3000"
  secretRef: "langfuse-secret"

keda:
  prometheusAddress: "http://prometheus.monitoring:9090"

securityContext:
  pod:
    enabled: true
  container:
    enabled: true

networkPolicy:
  enabled: false

pdb:
  enabled: false

affinity:
  enabled: false

topologySpreadConstraints:
  enabled: false

gracefulShutdown:
  periodSeconds: 15

# ── 외부 접근 포트 참조 (NodePort) ───────────────────────────
# 에이전트: Helm chart (agent-service.yaml)가 관리
# 모니터링/Langfuse: infra/k8s/ 매니페스트가 관리
externalPorts:
  orchestrator: 30800   # agent-service.yaml (service.nodePort)
  grafana: 30300        # infra/k8s/monitoring/grafana.yaml
  langfuse: 30301       # infra/k8s/langfuse.yaml
