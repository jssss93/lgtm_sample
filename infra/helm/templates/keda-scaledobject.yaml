{{- range .Values.agents }}
{{- if .keda }}
{{- if .keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-{{ .name }}
    app.kubernetes.io/part-of: agent-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-{{ .name }}
  minReplicaCount: {{ .keda.minReplicas | default 1 }}
  maxReplicaCount: {{ .keda.maxReplicas | default 4 }}
  cooldownPeriod: {{ .keda.cooldownPeriod | default 300 }}
  pollingInterval: {{ .keda.pollingInterval | default 15 }}
  triggers:
  - type: prometheus
    metadata:
      serverAddress: {{ $.Values.keda.prometheusAddress }}
      metricName: agent_run_count_total
      query: |
        sum(rate(agent_run_count_total{agent_type="{{ .type }}"}[1m]))
      threshold: "{{ .keda.targetRPS | default 1 }}"
---
{{- end }}
{{- end }}
{{- end }}
