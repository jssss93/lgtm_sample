agents:
  - name: orchestrator
    type: orchestrator
    model: gpt-4.1
    replicas: 1
    port: 8000
    service:
      type: NodePort
      nodePort: 30800
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    hpa:
      enabled: false
    keda:
      enabled: false
    isOrchestrator: true

  - name: search
    type: search
    model: gpt-4.1-mini
    replicas: 1
    port: 8001
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
    hpa:
      enabled: false
    keda:
      enabled: false

  - name: summarizer
    type: summarizer
    model: gpt-4.1-mini
    replicas: 1
    port: 8002
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 200m
    hpa:
      enabled: false
    keda:
      enabled: false

  - name: coder
    type: coder
    model: gpt-4.1
    replicas: 1
    port: 8003
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    hpa:
      enabled: false
    keda:
      enabled: false
