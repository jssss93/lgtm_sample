# ════════════════════════════════════════════════════════════════
# Azure OpenAI 시크릿 (로컬 테스트용)
# 실제 값으로 교체 후 적용:
#   kubectl apply -f k8s-local/aoai-secret.yaml -n agent-platform
#
# 또는 CLI로 생성:
#   kubectl create secret generic aoai-secret \
#     --from-literal=api-key=YOUR_KEY \
#     --from-literal=endpoint=https://YOUR_RESOURCE.openai.azure.com/ \
#     -n agent-platform
# ════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: aoai-secret
  namespace: agent-platform
type: Opaque
stringData:
  api-key: "REPLACE_WITH_YOUR_API_KEY"
  endpoint: "REPLACE_WITH_YOUR_ENDPOINT"
