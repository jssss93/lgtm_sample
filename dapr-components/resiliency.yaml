apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: agent-resiliency
spec:
  policies:
    retries:
      # sub-agent 호출 재시도 정책
      agentRetry:
        policy: constant
        duration: 3s
        maxRetries: 3
      # state store 재시도 정책
      stateRetry:
        policy: exponential
        maxInterval: 10s
        maxRetries: 5
    timeouts:
      # sub-agent 호출 타임아웃
      agentTimeout: 30s
      # state store 타임아웃
      stateTimeout: 5s
    circuitBreakers:
      # sub-agent circuit breaker
      agentCB:
        maxRequests: 5
        interval: 10s
        timeout: 30s
        trip: consecutiveFailures > 3

  targets:
    apps:
      agent-search:
        retry: agentRetry
        timeout: agentTimeout
        circuitBreaker: agentCB
      agent-coder:
        retry: agentRetry
        timeout: agentTimeout
        circuitBreaker: agentCB
      agent-summarizer:
        retry: agentRetry
        timeout: agentTimeout
        circuitBreaker: agentCB

    components:
      statestore:
        outbound:
          retry: stateRetry
          timeout: stateTimeout
      pubsub:
        outbound:
          retry: stateRetry
          timeout: stateTimeout
