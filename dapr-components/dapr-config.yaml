apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: daprConfig
spec:
  # Docker Compose: mdns (default), K8s: kubernetes
  nameResolution:
    component: "mdns"

  accessControl:
    defaultAction: deny
    trustDomain: "public"
    policies:
    # orchestrator: 모든 agent 호출 가능
    - appId: agent-orchestrator
      defaultAction: allow
      trustDomain: "public"
      namespace: "default"

    # sub-agent: pub/sub 이벤트 수신 + health + run 만 허용
    - appId: agent-search
      defaultAction: deny
      trustDomain: "public"
      namespace: "default"
      operations:
      - action: allow
        httpVerb: ["POST"]
        name: /events
      - action: allow
        httpVerb: ["GET"]
        name: /health
      - action: allow
        httpVerb: ["POST"]
        name: /run

    - appId: agent-summarizer
      defaultAction: deny
      trustDomain: "public"
      namespace: "default"
      operations:
      - action: allow
        httpVerb: ["POST"]
        name: /events
      - action: allow
        httpVerb: ["GET"]
        name: /health
      - action: allow
        httpVerb: ["POST"]
        name: /run

    - appId: agent-coder
      defaultAction: deny
      trustDomain: "public"
      namespace: "default"
      operations:
      - action: allow
        httpVerb: ["POST"]
        name: /events
      - action: allow
        httpVerb: ["GET"]
        name: /health
      - action: allow
        httpVerb: ["POST"]
        name: /run
